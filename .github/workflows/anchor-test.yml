name: Anchor CI - Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          # Try official Solana installer with retries; do not treat a failed curl as success.
          installed=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt to download Solana CLI..."
            if curl -fsSL https://release.solana.com/v1.18.26/install -o /tmp/solana-install.sh \
              && sh /tmp/solana-install.sh; then
              installed=1
              break
            elif wget -qO /tmp/solana-install.sh https://release.solana.com/v1.18.26/install \
              && sh /tmp/solana-install.sh; then
              installed=1
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "Failed to download Solana CLI after 3 attempts. Continuing without it..."
            else
              sleep 10
            fi
          done
          if [ "$installed" -eq 1 ]; then
            echo "${HOME}/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
            export PATH="${HOME}/.local/share/solana/install/active_release/bin:$PATH"
            solana --version || echo "Solana CLI install reported success but binary missing"
          else
            echo "Solana CLI not available, will use cargo sbpf"
          fi

      - name: Install Anchor CLI
        run: |
          npm ci --no-audit --no-fund || true
          npm install -g @coral-xyz/anchor@0.30.1 --unsafe-perm=true || true
          anchor --version || echo "Anchor CLI not available, will use cargo sbpf"

      - name: Install npm dependencies (root)
        run: |
          npm ci --legacy-peer-deps

      - name: Build Solana Program (cargo sbpf fallback)
        run: |
          cd programs/cryptrans
          rustup target add sbpf-solana-solana || true
          cargo build-sbf 2>&1 || cargo build --target sbpf-solana-solana 2>&1 || echo "BPF build skipped"

      - name: Run anchor test
        env:
          CI: true
        run: |
          # Run tests from repo root. Anchor will build programs and run tests.
          anchor test --skip-build || anchor test
